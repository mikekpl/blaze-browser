[workspace]
resolver = "2"
members = [
    "crates/blaze-core",
    "crates/blaze-engine",
    "crates/blaze-engine-servo",
    "crates/blaze-adblock",
    "crates/blaze-net",
    "crates/blaze-storage",
    "crates/blaze-media",
    "crates/blaze-ffi",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
# servo 0.4.0 MSRV
rust-version = "1.88"
license = "MPL-2.0"

[workspace.dependencies]
blaze-core = { path = "crates/blaze-core" }
blaze-engine = { path = "crates/blaze-engine" }
blaze-adblock = { path = "crates/blaze-adblock" }
blaze-net = { path = "crates/blaze-net" }
blaze-storage = { path = "crates/blaze-storage" }
blaze-media = { path = "crates/blaze-media" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
dirs = "5"
rusqlite = { version = "0.37", features = ["bundled"] } # aligned with servo 0.4.0 (links = "sqlite3")
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "blocking"] }
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "content-blocking"] }
libservo = { package = "servo", version = "0.4.0" }
uniffi = "0.29"
proptest = "1"
tempfile = "3"
criterion = "0.5"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
# unwind (not abort) is required: panic isolation at FFI/tab boundaries
panic = "unwind"
lto = "thin"
codegen-units = 1
