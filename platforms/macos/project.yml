name: Blaze
options:
  bundleIdPrefix: dev.blaze
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Blaze:
    type: application
    platform: macOS
    sources:
      - path: Blaze
      - path: Generated
        includes:
          - "*.swift"
      - path: ../../assets
        buildPhase: resources
        type: folder
    dependencies:
      - framework: Generated/BlazeFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.blaze.Blaze
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Blaze/Blaze.entitlements
        CODE_SIGN_IDENTITY: "-"
        LIBRARY_SEARCH_PATHS: "$(inherited)"
        SWIFT_OBJC_INTEROP_MODE: objc
        OTHER_LDFLAGS: "-lc++"

  BlazeTests:
    type: bundle.unit-test
    platform: macOS
    sources: [BlazeTests]
    dependencies:
      - target: Blaze
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.blaze.BlazeTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Blaze.app/Contents/MacOS/Blaze"
        BUNDLE_LOADER: "$(TEST_HOST)"

  BlazeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [BlazeUITests]
    dependencies:
      - target: Blaze
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.blaze.BlazeUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Blaze

schemes:
  Blaze:
    build:
      targets:
        Blaze: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BlazeTests
        - BlazeUITests
