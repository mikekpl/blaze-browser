[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
# Chromium/Blink is prohibited by spec; telemetry libraries prohibited by FR-035
deny = [
    { crate = "sentry" },
    { crate = "posthog-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
